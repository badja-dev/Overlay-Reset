name: ARMv7 Candidate Test

# Throwaway fork-only test of the real Dockerfile; never open a PR with this file.
on:
  workflow_dispatch:

jobs:

  armv7-build-and-import:
    name: armv7 - build real Dockerfile, then import cv2/numpy/PIL inside it
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:

      - name: Check Out Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build armv7 image
        shell: bash
        run: |
          time docker buildx build --progress=plain --platform linux/arm/v7 --file ./Dockerfile --build-arg BRANCH_NAME=armv7-test --load --tag overlay-reset-armv7-test . 2>&1 | tee build.log
          echo "RESULT piwheels downloads: $(grep -c 'piwheels.org' build.log || true)"
          echo "RESULT source builds: $(grep -c 'Building wheel for' build.log || true)"
          grep -E 'Building wheel for' build.log || echo "RESULT no wheels were built from source"

      - name: Report every missing shared library in the armv7 image
        if: always()
        shell: bash
        run: |
          docker run --rm --platform linux/arm/v7 --entrypoint sh overlay-reset-armv7-test -c 'find /usr/local/lib/python3.13/site-packages -name "*.so*" -type f | while read f; do ldd "$f" 2>/dev/null | grep "not found" | sed "s|^|$f: |"; done | sed "s|.*/site-packages/||" | sort | uniq | head -50; echo "RESULT ldd scan done"'

      - name: Import check inside the armv7 image
        shell: bash
        run: |
          docker run --rm --platform linux/arm/v7 --entrypoint python3 overlay-reset-armv7-test -c "import cv2, numpy, PIL, plexapi, requests, tmdbapis, kometautils; print('RESULT imports ok: cv2', cv2.__version__, '| numpy', numpy.__version__, '| PIL', PIL.__version__)"

      - name: OpenCV smoke test inside the armv7 image
        shell: bash
        run: |
          docker run -i --rm --platform linux/arm/v7 --entrypoint python3 overlay-reset-armv7-test - <<'PY'
          import cv2, numpy as np
          from PIL import Image
          rng = np.random.default_rng(1)
          img = rng.integers(0, 255, (200, 300, 3), dtype=np.uint8)
          cv2.imwrite("/tmp/a.png", img)
          cv2.imwrite("/tmp/t.png", img[50:90, 100:160])
          big = cv2.imread("/tmp/a.png")
          tpl = cv2.imread("/tmp/t.png")
          res = cv2.matchTemplate(big, tpl, cv2.TM_CCOEFF_NORMED)
          ys, xs = np.where(res >= 0.95)
          assert (int(xs[0]), int(ys[0])) == (100, 50), (xs, ys)
          assert Image.open("/tmp/a.png").size == (300, 200)
          print("RESULT smoke ok: matchTemplate found template at (100, 50)")
          PY

  amd64-arm64-regression:
    name: amd64 + arm64 - Dockerfile still builds
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:

      - name: Check Out Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build amd64 and arm64
        shell: bash
        run: |
          time docker buildx build --progress=plain --platform linux/amd64,linux/arm64 --file ./Dockerfile --build-arg BRANCH_NAME=armv7-test .
